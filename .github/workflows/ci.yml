name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Banco efêmero para o teste de carga de contexto (@SpringBootTest).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: matchvagas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # ── Datasource apontando para o Postgres de serviço ──────────────────────
      DATABASE_PREFIX: jdbc:postgresql
      DATABASE_URL: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: matchvagas_test
      DATABASE_PREPARED_STATEMENTS: ""
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      # ── Segredos dummy só para o contexto subir no CI (nunca reais) ──────────
      JWT_SECRET: ci-only-jwt-secret-com-mais-de-32-bytes-para-hs256-000
      CPF_ENCRYPTION_KEY: ci-only-cpf-encryption-key
      CPF_HASH_SECRET: ci-only-cpf-hash-secret
      # APP_ENV fica em 'dev' (padrão) — o StartupSecretsValidator só avisa, não aborta.

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
