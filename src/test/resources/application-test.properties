spring.datasource.url=jdbc:h2:mem:matchvagas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Testes nunca devem carregar nem baixar o modelo ONNX.
app.embeddings.enabled=false

# Valores locais e descartáveis exigidos na carga do contexto.
jwt.secret=test-only-jwt-secret-com-mais-de-32-bytes-para-hs256
app.env=dev
