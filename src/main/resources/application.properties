spring.application.name=backend

spring.session.jdbc.initialize-schema=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/matchvagas
spring.datasource.username=root
spring.datasource.password=

#server configuration
server.port=8080

#JWT configuration
jwt.secret=your_jwt_secret_key
jwt.expiration=3600000
jwt.prefix=Bearer
jwt.header=Authorization

#swagger configuration
swagger.api.title=Your API Title
swagger.api.description=Your API Description
swagger.api.version=1.0.0
swagger.api.terms-of-service-url=http://example.com/terms
swagger.api.contact.name=Your Name
swagger.api.contact.url=http://example.com/contact  
swagger.api.contact.email=your.email@example.com

# Logging configuration
logging.level.org.springframework=INFO
logging.level.com.yourpackage=DEBUG

# CORS configuration
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE
cors.allowed-headers=Content-Type,Authorization
spring.graphql.cors.exposed-headers=Authorization
cors.allow-credentials=true
cors.max-age=3600

#security configuration
spring.security.user.name=admin
spring.security.user.password=adminpassword
#spring.security.user.roles=USER,ADMIN
