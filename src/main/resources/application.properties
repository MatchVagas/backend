spring.application.name=backend

spring.config.import=optional:file:.env[.properties]

spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT}
spring.datasource.driver-class-name=${DATABASE_DRIVER}
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DATABASE_PREFIX}://${DATABASE_URL}:${DATABASE_PORT}/${DATABASE_NAME}${DATABASE_PREPARED_STATEMENTS}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Observabilidade / Actuator ────────────────────────────────────────────────
# Expõe apenas health, info e metrics. /actuator/health é público (health check
# do provedor); os demais exigem ADMIN (ver SecurityConfig). Probes liveness/
# readiness habilitadas para orquestração.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.env=${APP_ENV:dev}

# ── Paginação ─────────────────────────────────────────────────────────────────
# Página padrão de 20 itens; teto de 100 por página para evitar que ?size=99999
# force a API a materializar coleções enormes.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ── Ambiente / segurança de inicialização (SEC-05) ─────────────────────────────
# Em produção defina APP_ENV=prod: a aplicação se recusa a subir se JWT_SECRET,
# CPF_ENCRYPTION_KEY ou CPF_HASH_SECRET estiverem ausentes/fracos.
app.env=${APP_ENV:dev}

# URL base do front-end, usada para montar links de e-mail (confirmação de conta).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Número de proxies confiáveis à frente da aplicação, usado para resolver o IP
# real do cliente (rate limiting) sem confiar cegamente em X-Forwarded-For.
# 0 = sem proxy (usa IP do socket); 1 = um reverse proxy (ex.: Render, padrão).
app.trusted-proxy-count=${APP_TRUSTED_PROXY_COUNT:1}

# ── JWT ───────────────────────────────────────────────────────────────────────
# A chave NUNCA deve ser commitada. É injetada via variável de ambiente JWT_SECRET
# (ver .env local / variáveis de ambiente do provedor em produção).
# Gere uma chave forte com: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.prefix=Bearer
jwt.header=Authorization
# Validade do refresh token (padrão 7 dias). O access token acima é curto; a
# renovação usa POST /api/auth/refresh (com rotação do refresh token).
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── Criptografia de CPF (LGPD-04) ─────────────────────────────────────────────
# Lidas diretamente do ambiente por CpfCrypto (NÃO commitar valores reais):
#   CPF_ENCRYPTION_KEY → segredo para cifrar o CPF (AES-256-GCM)
#   CPF_HASH_SECRET    → segredo do HMAC-SHA256 usado na unicidade do CPF
# Sem essas variáveis, um fallback de desenvolvimento (inseguro) é usado.
# IMPORTANTE: trocar a chave invalida os CPFs já cifrados/hasheados.

# ── Springdoc / Swagger UI ────────────────────────────────────────────────────
# Swagger UI disponível em: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Desabilita a segurança padrão do Springdoc (deixa o Spring Security cuidar)
springdoc.swagger-ui.disable-swagger-default-url=true

# Ordena os endpoints por método HTTP (GET antes de POST, etc.)
springdoc.swagger-ui.operations-sorter=method

# Ordena as tags (controllers) em ordem alfabética
springdoc.swagger-ui.tags-sorter=alpha

# Expande os modelos de request/response automaticamente
springdoc.swagger-ui.default-models-expand-depth=1

# Persiste a autorização JWT entre recarregamentos da página
springdoc.swagger-ui.persist-authorization=true

# Exibe o botão "Try it out" habilitado por padrão
springdoc.swagger-ui.try-it-out-enabled=true

# Habilita o seletor de grupo (abas por domínio)
springdoc.swagger-ui.display-request-duration=true

# ── Logging ───────────────────────────────────────────────────────────────────
# Nível INFO evita vazamento de dados sensíveis (CPF, email, tokens) nos logs
# de produção (SEC-09 / LGPD-03 Art. 46). Para depurar localmente, sobrescreva
# com LOGGING_LEVEL_COM_MATCHVAGAS=DEBUG via variável de ambiente.
logging.level.org.springframework=INFO
logging.level.com.matchvagas=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ── Retenção de dados (LGPD-09) ───────────────────────────────────────────────
# Job mensal de pseudoanonimização de candidatos inativos e limpeza de currículos.
lgpd.retencao.enabled=${LGPD_RETENCAO_ENABLED:true}
lgpd.retencao.inatividade-anos=${LGPD_RETENCAO_INATIVIDADE_ANOS:2}
lgpd.retencao.curriculo-inatividade-anos=${LGPD_RETENCAO_CURRICULO_ANOS:1}

# ── Upload de arquivos ────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── Supabase Storage ─────────────────────────────────────────────────────────
# SUPABASE_URL      → ex: https://xyzxyzxyz.supabase.co
# SUPABASE_SERVICE_ROLE_KEY → chave de serviço (Settings > API > service_role)
# SUPABASE_BUCKET   → nome do bucket criado no Supabase Storage (padrão: curriculos)
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_BUCKET:curriculos}
supabase.storage.images-bucket=${SUPABASE_IMAGES_BUCKET:imagens-perfil}

# ── Email ─────────────────────────────────────────────────────────────────────
# Seletor de provedor: MAIL_USE_GMAIL=true usa Gmail/SMTP; false (padrão) usa Resend.
# Obs.: o Render bloqueia SMTP de saída — em produção mantenha o Resend (false).
mail.use-gmail=${MAIL_USE_GMAIL:false}

# Provedor padrão — Resend (API HTTP, resend.com, free: 3k emails/mês)
# RESEND_API_KEY  → API key gerada em resend.com/api-keys
# RESEND_FROM     → remetente verificado, ex: noreply@seudominio.com
#                   (no plano free use: onboarding@resend.dev para testes)
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}

# Backup — Gmail / SMTP (usado quando MAIL_USE_GMAIL=true)
# Em conta Gmail use uma "Senha de app" (não a senha normal) em MAIL_PASSWORD.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── CORS (SEC-08) ──────────────────────────────────────────────────────────────
# Em produção, defina CORS_ALLOWED_ORIGINS com a lista EXPLÍCITA de domínios do
# front-end (ex.: https://app.matchvagas.com,https://www.matchvagas.com).
# O curinga "*" é aceito apenas para desenvolvimento e, por exigência da spec,
# força credenciais desligadas (a API usa JWT no header Authorization, não cookies).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Content-Type,Authorization}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
cors.max-age=${CORS_MAX_AGE:3600}

# ── Embeddings locais (ONNX) ──────────────────────────────────────────────
# Desligado por padrão: CI/dev não baixam modelo. Em produção, habilite e
# informe um modelo/tokenizer ONNX multilíngue por URL ou file:.
app.embeddings.enabled=${APP_EMBEDDINGS_ENABLED:false}
app.embeddings.dimensao=${APP_EMBEDDINGS_DIMENSAO:384}
app.embeddings.modelo=${APP_EMBEDDINGS_MODELO:onnx-transformers}
app.embeddings.model-uri=${APP_EMBEDDINGS_MODEL_URI:}
app.embeddings.tokenizer-uri=${APP_EMBEDDINGS_TOKENIZER_URI:}
app.embeddings.cache-dir=${APP_EMBEDDINGS_CACHE_DIR:${java.io.tmpdir}/matchvagas-onnx}
