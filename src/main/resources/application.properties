spring.application.name=backend

spring.config.import=optional:file:.env[.properties]

spring.session.jdbc.initialize-schema=always

spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT}
spring.datasource.driver-class-name=${DATABASE_DRIVER}
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DATABASE_PREFIX}://${DATABASE_URL}:${DATABASE_PORT}/${DATABASE_NAME}${DATABASE_PREPARED_STATEMENTS}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# ── JWT ───────────────────────────────────────────────────────────────────────
# Mínimo 32 caracteres (256 bits) exigido pelo HMAC-SHA256
# TROQUE esta chave antes de ir para produção!
jwt.secret=matchvagas_chave_secreta_minimo_256bits_troque_em_producao!
jwt.expiration=3600000
jwt.prefix=Bearer
jwt.header=Authorization

# ── Springdoc / Swagger UI ────────────────────────────────────────────────────
# Swagger UI disponível em: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Desabilita a segurança padrão do Springdoc (deixa o Spring Security cuidar)
springdoc.swagger-ui.disable-swagger-default-url=true

# Ordena os endpoints por método HTTP (GET antes de POST, etc.)
springdoc.swagger-ui.operations-sorter=method

# Ordena as tags (controllers) em ordem alfabética
springdoc.swagger-ui.tags-sorter=alpha

# Expande os modelos de request/response automaticamente
springdoc.swagger-ui.default-models-expand-depth=1

# Persiste a autorização JWT entre recarregamentos da página
springdoc.swagger-ui.persist-authorization=true

# Exibe o botão "Try it out" habilitado por padrão
springdoc.swagger-ui.try-it-out-enabled=true

# Habilita o seletor de grupo (abas por domínio)
springdoc.swagger-ui.display-request-duration=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework=INFO
logging.level.com.matchvagas=DEBUG

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE
cors.allowed-headers=Content-Type,Authorization
spring.graphql.cors.exposed-headers=Authorization
cors.allow-credentials=true
cors.max-age=3600
